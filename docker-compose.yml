services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - "OPENAI_API_KEY=${OPENAI_API_KEY}"
      - "TAVILY_API_KEY=${TAVILY_API_KEY}"

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
        - VITE_WS_URL=ws://localhost:8000
    ports:
      - "8080:80"
